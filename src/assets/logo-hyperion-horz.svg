<svg xmlns="http://www.w3.org/2000/svg" width="300" height="70" viewBox="0 0 300 70" role="img" aria-labelledby="hyperion-title">
  <title id="hyperion-title">Hyperion</title>
  <!-- Emblem geometry and draw/heartbeat motion from the Hyperion Control Plane.
       Outlined wordmark retained from the explorer brand asset; no font request. -->
  <style>
    .emblem { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .gem { stroke: #141519; stroke-width: 2.6; }
    .inner { stroke: #141519; stroke-width: 1.1; }
    .beat { stroke: #0094d2; stroke-width: 3; }
    .base { opacity: .3; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 0; }
    .em-gem { animation: em-draw 1.1s cubic-bezier(.16,1,.3,1) .08s backwards; }
    .em-inner { opacity: .42; animation: em-draw .9s cubic-bezier(.16,1,.3,1) .3s backwards; }
    .em-beat { animation: em-draw .8s cubic-bezier(.65,0,.35,1) .6s backwards; }
    .em-blip { stroke: #77d1f6; stroke-width: 3; stroke-dasharray: .07 1.4; opacity: 0; animation: em-blip 1.4s cubic-bezier(.45,0,.25,1) 1.6s; }
    .letter { fill: #141519; animation: wm-in .6s cubic-bezier(.16,1,.3,1) calc(.25s + var(--i) * 40ms) backwards; }
    @keyframes em-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes em-blip { 0% { stroke-dashoffset: .07; opacity: 1; } 58% { stroke-dashoffset: -1; opacity: 1; } 59%,100% { stroke-dashoffset: -1; opacity: 0; } }
    @keyframes wm-in { from { opacity: .6; filter: blur(1px); } to { opacity: 1; filter: none; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .letter, .em-blip { animation: none; }
      .trace { stroke-dashoffset: 0; }
      .em-blip { display: none; }
    }
  </style>
  <g class="emblem" transform="translate(1 1)">
    <path class="gem base" d="M23 2.3 L37.9 21.6 L43.9 51.4 L23 64.4 L2.1 51.4 L8.1 21.6 Z"/>
    <path class="inner base" d="M23 7.6 L35.5 24.6 L40.6 48.2 L23.1 59.3 L5.8 48.2 L10.6 24.6 Z"/>
    <path class="beat base" d="M7.9 38 L13.5 38 L19 19.5 L15.6 52 L21 38 L25 38 L30.5 18.5 L27.6 51 L32 38 L38.2 38"/>
    <path class="gem trace em-gem" pathLength="1" d="M23 2.3 L37.9 21.6 L43.9 51.4 L23 64.4 L2.1 51.4 L8.1 21.6 Z"/>
    <path class="inner trace em-inner" pathLength="1" d="M23 7.6 L35.5 24.6 L40.6 48.2 L23.1 59.3 L5.8 48.2 L10.6 24.6 Z"/>
    <path class="beat trace em-beat" pathLength="1" d="M7.9 38 L13.5 38 L19 19.5 L15.6 52 L21 38 L25 38 L30.5 18.5 L27.6 51 L32 38 L38.2 38"/>
    <path class="em-blip" pathLength="1" d="M7.9 38 L13.5 38 L19 19.5 L15.6 52 L21 38 L25 38 L30.5 18.5 L27.6 51 L32 38 L38.2 38"/>
  </g>
