<div class="explorer-layout" [class.is-home]="isHome()" [style.--header-collapse]="headerProgress()">
  <header id="header-container" class="header-card" aria-label="Explorer navigation">
    <div class="header-inner">
      <a routerLink="/" class="chain-brand" aria-label="Hyperion Explorer home">
        <img [src]="chainData()?.logo" [alt]="(chainData()?.chain_name || 'Hyperion') + ' explorer'" class="chain-logo" width="260" height="70" />
      </a>
      <form [formGroup]="searchForm" (ngSubmit)="submit()" class="header-search" role="search" aria-label="Blockchain search">
        <div class="custom-input-group search-control">
          <input #searchFieldRef formControlName="search_field" type="search" class="custom-input"
                 placeholder="Account, block, transaction or public key"
                 aria-label="Account name, block number, transaction ID, or public key" aria-describedby="search-error"
                 autocomplete="off" autocapitalize="off" spellcheck="false" [matAutocomplete]="auto" />
          <button type="submit" aria-label="Search blockchain" mat-raised-button class="search-btn primary-btn">
            <fa-icon [icon]="icons.search"></fa-icon><span>Search</span>
          </button>
        </div>
        <mat-autocomplete #auto="matAutocomplete" (optionSelected)="submit()" class="custom-autocomplete">
          @for (account of filteredAccounts(); track account) { <mat-option [value]="account">{{ account }}</mat-option> }
        </mat-autocomplete>
        <div id="search-error" class="search-message" aria-live="polite">{{ err() }}</div>
      </form>
      <div class="provider">
        <span class="provider-label">Data provider</span>
        <a [href]="chainData()?.provider_url" target="_blank" rel="noopener noreferrer">{{ chainData()?.provider }}</a>
      </div>
      <p class="header-description">Lightweight Explorer</p>
    </div>
  </header>
  <div id="content-container" class="content-container">
    <main id="main-content" tabindex="-1"><router-outlet></router-outlet></main>
    <footer class="explorer-footer hr-container">
      <span class="footer-color">v{{ version }} · Made with
        <fa-icon [icon]="icons.heart" aria-hidden="true"></fa-icon>
        by RioBlocks
      </span>
      <div class="footer-links">
        <button type="button" aria-label="Choose explorer theme" [attr.aria-expanded]="showThemeSelector()" (click)="showThemeSelector.set(!showThemeSelector())" class="theme-toggle">Theme</button>
        <a class="icon-link" aria-label="Hyperion Explorer on GitHub" href="https://github.com/eosrio/hyperion-explorer" target="_blank" rel="noopener noreferrer"><fa-icon [icon]="icons.github"></fa-icon></a>
        <a class="icon-link" aria-label="Hyperion community on Telegram" href="https://t.me/EOSHyperion" target="_blank" rel="noopener noreferrer"><fa-icon [icon]="icons.telegram"></fa-icon></a>
      </div>
    </footer>
    @if (showThemeSelector()) { <app-theme-selector></app-theme-selector> }
  </div>
</div>
