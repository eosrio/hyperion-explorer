<section class="error-page hr-container">
  <div class="custom-card error-panel" role="alert">
    <img src="assets/logo-hyperion-horz.svg" alt="Hyperion" width="220" height="60">
    <h1>Unable to load the explorer</h1>
    <p>Check the API connection and try again.</p>
    <p class="error-reason faded">{{ ds.initError }}</p>
    <button type="button" (click)="retry()" class="primary-btn">Try again</button>
  </div>
</section>
