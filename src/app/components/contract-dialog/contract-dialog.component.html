<header mat-dialog-title class="cd-head">
  <div class="cd-title">
    <h2>Contract <span class="cd-code">{{ code() }}</span></h2>
    <a class="cd-page-link" [routerLink]="pagePath()" mat-dialog-close>Open as a page</a>
  </div>
  <button mat-icon-button mat-dialog-close aria-label="Close contract explorer" class="cd-close">
    <mat-icon>close</mat-icon>
  </button>
</header>

<div mat-dialog-content class="cd-body">
  <app-contract-explorer navMode="dialog" [(code)]="code" [(table)]="table" [(scope)]="scope"></app-contract-explorer>
</div>
