<div class="theme-settings hr-container">
  <mat-form-field>
    <mat-label>Theme</mat-label>
    <mat-select [value]="selectedTheme()" (selectionChange)="selectTheme($event.value)" [disabled]="loading()">
      <mat-option value="UNSET_THEME">Chain default</mat-option>
      @for (theme of ds.availableThemes; track theme) { <mat-option [value]="theme">{{ theme }}</mat-option> }
    </mat-select>
  </mat-form-field>
  <p class="faded">Appearance changes apply to {{ ds.explorerMetadata()?.chain_name }} on this browser.</p>
  @if (error()) { <p class="api-error" role="alert">{{ error() }}</p> }
</div>
